<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#991B1B"/>
      <stop offset="0.5" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="phoneHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B91C1C"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- decorative dots -->
  <g fill="#FFFFFF" opacity="0.08">
    <circle cx="80" cy="60" r="3"/>
    <circle cx="140" cy="120" r="2"/>
    <circle cx="60" cy="200" r="2"/>
    <circle cx="200" cy="40" r="2.5"/>
    <circle cx="940" cy="80" r="3"/>
    <circle cx="980" cy="160" r="2"/>
    <circle cx="900" cy="420" r="2.5"/>
    <circle cx="40" cy="440" r="2"/>
  </g>

  <!-- LEFT: Copy block -->
  <g transform="translate(64,110)">
    <!-- brand chip -->
    <g>
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#FFFFFF" opacity="0.18"/>
      <circle cx="20" cy="17" r="6" fill="#FFFFFF"/>
      <text x="36" y="22" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">GRITSYNC</text>
    </g>

    <text x="0" y="100" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Pass the NCLEX.</text>
    <text x="0" y="158" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="56" font-weight="800" fill="#FECACA" letter-spacing="-1.5">Land the job.</text>

    <text x="0" y="208" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.92">Applications, documents, review and</text>
    <text x="0" y="234" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.92">Pearson-style mock exams — all in one app.</text>

    <!-- feature pills -->
    <g transform="translate(0,270)">
      <g>
        <rect x="0" y="0" width="130" height="30" rx="15" fill="#FFFFFF" opacity="0.16"/>
        <text x="14" y="20" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Q-Banks</text>
        <circle cx="115" cy="15" r="3" fill="#FFFFFF"/>
      </g>
      <g transform="translate(142,0)">
        <rect x="0" y="0" width="120" height="30" rx="15" fill="#FFFFFF" opacity="0.16"/>
        <text x="14" y="20" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Mock Exams</text>
      </g>
      <g transform="translate(274,0)">
        <rect x="0" y="0" width="110" height="30" rx="15" fill="#FFFFFF" opacity="0.16"/>
        <text x="14" y="20" font-family="Inter, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Live Class</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: Phone mockup -->
  <g transform="translate(680,40)">
    <!-- back phone (tilted) -->
    <g transform="rotate(8 130 220)" opacity="0.55">
      <rect x="0" y="0" width="220" height="430" rx="34" fill="#0B0B0E" filter="url(#phoneShadow)"/>
      <rect x="6" y="6" width="208" height="418" rx="28" fill="#FFFFFF"/>
      <rect x="6" y="6" width="208" height="130" rx="28" fill="url(#phoneHero)"/>
      <rect x="6" y="120" width="208" height="16" fill="url(#phoneHero)"/>
      <rect x="20" y="160" width="180" height="50" rx="10" fill="#F3F4F6"/>
      <rect x="20" y="220" width="180" height="50" rx="10" fill="#F3F4F6"/>
      <rect x="20" y="280" width="180" height="50" rx="10" fill="#F3F4F6"/>
    </g>

    <!-- front phone -->
    <g transform="translate(40,0)">
      <!-- bezel -->
      <rect x="0" y="0" width="260" height="500" rx="38" fill="#0B0B0E"/>
      <rect x="6" y="6" width="248" height="488" rx="32" fill="#FFFFFF"/>
      <!-- status bar -->
      <rect x="6" y="6" width="248" height="22" fill="#B91C1C"/>
      <text x="22" y="22" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">9:41</text>
      <g fill="#FFFFFF">
        <rect x="210" y="13" width="3" height="8" rx="1"/>
        <rect x="216" y="11" width="3" height="10" rx="1"/>
        <rect x="222" y="9" width="3" height="12" rx="1"/>
        <rect x="232" y="11" width="14" height="8" rx="2"/>
      </g>
      <!-- hero -->
      <path d="M6 28 L254 28 L254 168 Q254 188 234 188 L26 188 Q6 188 6 168 Z" fill="url(#phoneHero)"/>
      <text x="22" y="58" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" opacity="0.85">Good morning</text>
      <text x="22" y="80" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Maria</text>
      <g transform="translate(22,90)">
        <rect x="0" y="0" width="86" height="16" rx="8" fill="#FFFFFF" opacity="0.22"/>
        <text x="10" y="11" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">GS-2025-0428</text>
      </g>
      <!-- stat strip -->
      <rect x="22" y="124" width="216" height="48" rx="10" fill="#FFFFFF" opacity="0.18"/>
      <g font-family="Inter, sans-serif" fill="#FFFFFF" text-anchor="middle">
        <text x="60" y="146" font-size="16" font-weight="800">3</text>
        <text x="60" y="162" font-size="7" font-weight="700" opacity="0.85" letter-spacing="0.6">ACTIVE</text>
        <text x="130" y="146" font-size="16" font-weight="800">7</text>
        <text x="130" y="162" font-size="7" font-weight="700" opacity="0.85" letter-spacing="0.6">COMPLETED</text>
        <text x="200" y="146" font-size="16" font-weight="800">12</text>
        <text x="200" y="162" font-size="7" font-weight="700" opacity="0.85" letter-spacing="0.6">TOTAL</text>
      </g>
      <line x1="95" y1="135" x2="95" y2="161" stroke="#FFFFFF" stroke-opacity="0.3"/>
      <line x1="165" y1="135" x2="165" y2="161" stroke="#FFFFFF" stroke-opacity="0.3"/>

      <!-- spotlight card -->
      <rect x="22" y="176" width="216" height="74" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="34" y="194" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#DC2626" letter-spacing="1">ACTIVE APPLICATION</text>
      <text x="34" y="212" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#111827">NCLEX-RN — California</text>
      <text x="34" y="226" font-family="Inter, sans-serif" font-size="8" fill="#6B7280">Reviewing documents</text>
      <rect x="34" y="232" width="66" height="13" rx="6.5" fill="#DBEAFE" stroke="#93C5FD"/>
      <text x="42" y="241" font-family="Inter, sans-serif" font-size="7" font-weight="800" fill="#1D4ED8" letter-spacing="0.5">IN PROGRESS</text>
      <circle cx="222" cy="213" r="11" fill="#FEF2F2"/>
      <path d="M218 209 L226 213 L218 217 Z" fill="#DC2626"/>

      <!-- quick actions -->
      <g transform="translate(22,260)">
        <rect x="0" y="0" width="102" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <circle cx="20" cy="25" r="13" fill="#FEF2F2"/>
        <text x="20" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#DC2626" text-anchor="middle">+</text>
        <text x="40" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#111827">Apply</text>

        <rect x="114" y="0" width="102" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <circle cx="134" cy="25" r="13" fill="#F5F3FF"/>
        <rect x="129" y="20" width="10" height="9" rx="1.5" fill="#7C3AED"/>
        <text x="154" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#111827">Docs</text>
      </g>
      <g transform="translate(22,320)">
        <rect x="0" y="0" width="102" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <circle cx="20" cy="25" r="13" fill="#EFF6FF"/>
        <rect x="14" y="22" width="12" height="7" rx="1" fill="#2563EB"/>
        <text x="40" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#111827">Emails</text>

        <rect x="114" y="0" width="102" height="50" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
        <circle cx="134" cy="25" r="13" fill="#ECFDF5"/>
        <path d="M128 27 L134 22 L140 27 L140 30 L128 30 Z" fill="#059669"/>
        <text x="154" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#111827">Review</text>
      </g>

      <!-- tab bar -->
      <rect x="6" y="466" width="248" height="28" fill="#FFFFFF" stroke="#E5E7EB"/>
      <g fill="#DC2626"><circle cx="40" cy="480" r="3"/></g>
      <g fill="#6B7280">
        <circle cx="92" cy="480" r="2.5"/>
        <circle cx="144" cy="480" r="2.5"/>
        <circle cx="196" cy="480" r="2.5"/>
        <circle cx="232" cy="480" r="2.5"/>
      </g>
    </g>
  </g>
</svg>
