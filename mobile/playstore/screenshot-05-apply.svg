<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <g font-family="Inter, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="540" y="140" font-size="64" font-weight="800" letter-spacing="-1">Apply in minutes,</text>
    <text x="540" y="216" font-size="64" font-weight="800" fill="#A7F3D0" letter-spacing="-1">not weeks</text>
  </g>

  <g transform="translate(180,300)">
    <rect x="-10" y="-10" width="740" height="1520" rx="80" fill="#000" filter="url(#shadow)" opacity="0.5"/>
    <rect width="720" height="1500" rx="68" fill="#0B0B0E"/>
    <rect x="14" y="14" width="692" height="1472" rx="58" fill="#FFFFFF"/>
    <rect x="290" y="14" width="140" height="28" rx="14" fill="#0B0B0E"/>

    <rect x="14" y="42" width="692" height="48" fill="#FFFFFF"/>
    <text x="40" y="74" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">9:41</text>

    <!-- Back row -->
    <g transform="translate(40,108)">
      <circle cx="20" cy="20" r="20" fill="#F3F4F6"/>
      <path d="M26 12 L18 20 L26 28" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="28" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#111827">New application</text>
    </g>

    <!-- Stepper -->
    <g transform="translate(40,180)">
      <line x1="30" y1="30" x2="610" y2="30" stroke="#E5E7EB" stroke-width="4"/>
      <line x1="30" y1="30" x2="320" y2="30" stroke="#DC2626" stroke-width="4"/>
      <g>
        <circle cx="30" cy="30" r="22" fill="#DC2626"/>
        <text x="30" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="30" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Type</text>
      </g>
      <g>
        <circle cx="175" cy="30" r="22" fill="#DC2626"/>
        <text x="175" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">✓</text>
        <text x="175" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">State</text>
      </g>
      <g>
        <circle cx="320" cy="30" r="22" fill="#DC2626"/>
        <text x="320" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="320" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#111827" text-anchor="middle">Details</text>
      </g>
      <g>
        <circle cx="465" cy="30" r="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
        <text x="465" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#9CA3AF" text-anchor="middle">4</text>
        <text x="465" y="78" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Docs</text>
      </g>
      <g>
        <circle cx="610" cy="30" r="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>
        <text x="610" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#9CA3AF" text-anchor="middle">5</text>
        <text x="610" y="78" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" text-anchor="middle">Pay</text>
      </g>
    </g>

    <!-- Form -->
    <g transform="translate(40,316)">
      <text font-family="Inter, sans-serif" font-size="28" font-weight="800" fill="#111827">Tell us about you</text>
      <text y="32" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">We'll pre-fill this for your future applications.</text>
    </g>

    <g transform="translate(40,400)" font-family="Inter, sans-serif">
      <text font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">FULL NAME</text>
      <rect y="20" width="640" height="64" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="60" font-size="20" font-weight="600" fill="#111827">Maria Santos Reyes</text>
      <text y="120" font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">EMAIL</text>
      <rect y="140" width="640" height="64" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="180" font-size="20" font-weight="600" fill="#111827">maria.reyes@gritsync.com</text>
      <text y="240" font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">PRC LICENSE #</text>
      <rect y="260" width="640" height="64" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="300" font-size="20" font-weight="600" fill="#111827">0123456</text>
      <text y="360" font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">YEARS OF EXPERIENCE</text>
      <g transform="translate(0,380)">
        <rect width="150" height="56" rx="28" fill="#DC2626"/>
        <text x="75" y="36" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2–4 years</text>
        <rect x="170" y="0" width="120" height="56" rx="28" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
        <text x="230" y="36" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">&lt; 2 years</text>
        <rect x="310" y="0" width="120" height="56" rx="28" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
        <text x="370" y="36" font-size="16" font-weight="700" fill="#6B7280" text-anchor="middle">5+ years</text>
      </g>
      <text y="486" font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">CURRENT EMPLOYER (OPTIONAL)</text>
      <rect y="506" width="640" height="64" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <text x="20" y="546" font-size="20" font-weight="500" fill="#9CA3AF">e.g. St. Luke's Medical Center</text>
    </g>

    <!-- Help card -->
    <g transform="translate(40,1010)">
      <rect width="640" height="100" rx="18" fill="#FEF2F2"/>
      <circle cx="56" cy="50" r="28" fill="#DC2626"/>
      <text x="56" y="58" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text>
      <text x="104" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#111827">Need help?</text>
      <text x="104" y="70" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">Message a coach — replies within 2 hours.</text>
    </g>

    <!-- CTA -->
    <g transform="translate(40,1310)">
      <rect width="640" height="84" rx="42" fill="#DC2626"/>
      <text x="320" y="56" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Continue → Documents</text>
    </g>
  </g>

  <text x="540" y="1870" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.95">A guided flow — never lost, never alone</text>
</svg>
