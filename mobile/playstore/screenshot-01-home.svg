<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B91C1C"/>
      <stop offset="0.5" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Headline -->
  <g font-family="Inter, Segoe UI, Roboto, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="540" y="140" font-size="64" font-weight="800" letter-spacing="-1">Track every step</text>
    <text x="540" y="216" font-size="64" font-weight="800" fill="#FECACA" letter-spacing="-1">to becoming a US RN</text>
  </g>

  <!-- Phone frame -->
  <g transform="translate(180,300)">
    <rect x="-10" y="-10" width="740" height="1520" rx="80" fill="#000" filter="url(#shadow)" opacity="0.4"/>
    <rect x="0" y="0" width="720" height="1500" rx="68" fill="#0B0B0E"/>
    <rect x="14" y="14" width="692" height="1472" rx="58" fill="#FFFFFF"/>
    <!-- notch -->
    <rect x="290" y="14" width="140" height="28" rx="14" fill="#0B0B0E"/>

    <!-- Status bar -->
    <g transform="translate(14,42)">
      <rect x="0" y="0" width="692" height="48" fill="#B91C1C"/>
      <text x="40" y="32" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">9:41</text>
      <g fill="#FFFFFF" transform="translate(580,16)">
        <rect x="0" y="6" width="6" height="12" rx="1"/>
        <rect x="12" y="3" width="6" height="15" rx="1"/>
        <rect x="24" y="0" width="6" height="18" rx="1"/>
        <rect x="44" y="4" width="30" height="14" rx="3"/>
      </g>
    </g>

    <!-- HERO -->
    <path d="M14 90 L706 90 L706 530 Q706 590 646 590 L74 590 Q14 590 14 530 Z" fill="url(#hero)"/>
    <g transform="translate(60,160)">
      <text font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" opacity="0.9">Good morning,</text>
      <text y="74" font-family="Inter, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Maria</text>
      <g transform="translate(0,96)">
        <rect width="220" height="42" rx="21" fill="#FFFFFF" opacity="0.22"/>
        <text x="20" y="28" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1">GS-2025-0428</text>
      </g>
    </g>
    <!-- bell + chat -->
    <g transform="translate(540,200)">
      <circle cx="50" cy="40" r="40" fill="#FFFFFF" fill-opacity="0.22"/>
      <path d="M50 22 a14 14 0 0 1 14 14 v10 l4 8 h-36 l4 -8 v-10 a14 14 0 0 1 14-14 z" fill="#FFFFFF"/>
      <circle cx="50" cy="60" r="3" fill="#FFFFFF"/>
      <circle cx="78" cy="14" r="14" fill="#FFFFFF"/>
      <text x="78" y="20" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#B91C1C" text-anchor="middle">3</text>
      <circle cx="140" cy="40" r="40" fill="#FFFFFF" fill-opacity="0.22"/>
      <path d="M120 30 h40 a10 10 0 0 1 10 10 v10 a10 10 0 0 1 -10 10 h-30 l-10 10 z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    </g>

    <!-- stat strip -->
    <g transform="translate(70,440)">
      <rect width="580" height="120" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
      <g font-family="Inter, sans-serif" fill="#FFFFFF" text-anchor="middle">
        <text x="97" y="56" font-size="44" font-weight="800">3</text>
        <text x="97" y="92" font-size="16" font-weight="700" opacity="0.9" letter-spacing="1.5">ACTIVE</text>
        <text x="290" y="56" font-size="44" font-weight="800">7</text>
        <text x="290" y="92" font-size="16" font-weight="700" opacity="0.9" letter-spacing="1.5">COMPLETED</text>
        <text x="483" y="56" font-size="44" font-weight="800">12</text>
        <text x="483" y="92" font-size="16" font-weight="700" opacity="0.9" letter-spacing="1.5">TOTAL</text>
      </g>
      <line x1="193" y1="35" x2="193" y2="95" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
      <line x1="386" y1="35" x2="386" y2="95" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
    </g>

    <!-- spotlight -->
    <g transform="translate(70,620)">
      <rect width="580" height="180" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="32" y="44" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#DC2626" letter-spacing="2">ACTIVE APPLICATION</text>
      <text x="32" y="86" font-family="Inter, sans-serif" font-size="30" font-weight="800" fill="#111827">NCLEX-RN — California</text>
      <text x="32" y="118" font-family="Inter, sans-serif" font-size="20" fill="#6B7280">Reviewing documents · Step 4 of 7</text>
      <rect x="32" y="132" width="160" height="32" rx="16" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
      <text x="48" y="154" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#1D4ED8" letter-spacing="1">IN PROGRESS</text>
      <circle cx="500" cy="90" r="36" fill="#FEF2F2"/>
      <path d="M488 80 L516 90 L488 100 Z" fill="#DC2626"/>
    </g>

    <!-- Quick actions header -->
    <text x="86" y="864" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#111827" letter-spacing="1.5">QUICK ACTIONS</text>

    <!-- Quick action grid -->
    <g transform="translate(70,884)">
      <!-- apply -->
      <rect width="280" height="120" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <circle cx="56" cy="60" r="32" fill="#FEF2F2"/>
      <text x="56" y="74" font-family="Inter, sans-serif" font-size="38" font-weight="800" fill="#DC2626" text-anchor="middle">+</text>
      <text x="108" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#111827">Apply</text>

      <!-- docs -->
      <g transform="translate(300,0)">
        <rect width="280" height="120" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <circle cx="56" cy="60" r="32" fill="#F5F3FF"/>
        <rect x="42" y="44" width="28" height="32" rx="4" fill="#7C3AED"/>
        <rect x="46" y="50" width="20" height="3" fill="#FFFFFF"/>
        <rect x="46" y="58" width="20" height="3" fill="#FFFFFF"/>
        <rect x="46" y="66" width="14" height="3" fill="#FFFFFF"/>
        <text x="108" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#111827">Documents</text>
      </g>

      <!-- emails -->
      <g transform="translate(0,140)">
        <rect width="280" height="120" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <circle cx="56" cy="60" r="32" fill="#EFF6FF"/>
        <rect x="40" y="50" width="32" height="22" rx="3" fill="none" stroke="#2563EB" stroke-width="3"/>
        <path d="M40 52 L56 64 L72 52" stroke="#2563EB" stroke-width="3" fill="none"/>
        <text x="108" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#111827">Emails</text>
      </g>

      <!-- review -->
      <g transform="translate(300,140)">
        <rect width="280" height="120" rx="20" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <circle cx="56" cy="60" r="32" fill="#ECFDF5"/>
        <path d="M42 64 L56 50 L70 64 L70 74 L42 74 Z" fill="#059669"/>
        <rect x="50" y="64" width="6" height="10" fill="#ECFDF5"/>
        <text x="108" y="70" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#111827">Review</text>
      </g>
    </g>

    <!-- applications card -->
    <g transform="translate(70,1190)">
      <rect width="580" height="244" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
      <text x="28" y="44" font-family="Inter, sans-serif" font-size="24" font-weight="800" fill="#111827">Your applications</text>
      <text x="28" y="70" font-family="Inter, sans-serif" font-size="16" fill="#6B7280">Latest activity across your NCLEX journey</text>

      <line x1="28" y1="92" x2="552" y2="92" stroke="#E5E7EB"/>
      <text x="28" y="124" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#111827">NCLEX-RN — California</text>
      <text x="28" y="146" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">Reviewing documents</text>
      <rect x="430" y="108" width="120" height="28" rx="14" fill="#DBEAFE" stroke="#93C5FD"/>
      <text x="490" y="126" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.8">IN PROGRESS</text>

      <line x1="28" y1="166" x2="552" y2="166" stroke="#E5E7EB"/>
      <text x="28" y="198" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#111827">CGFNS Credentials</text>
      <text x="28" y="220" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">Awaiting transcript</text>
      <rect x="450" y="182" width="100" height="28" rx="14" fill="#FEF3C7" stroke="#FCD34D"/>
      <text x="500" y="200" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle" letter-spacing="0.8">PENDING</text>
    </g>

    <!-- Tab bar -->
    <rect x="14" y="1414" width="692" height="72" fill="#FFFFFF" stroke="#E5E7EB"/>
    <g transform="translate(60,1430)">
      <!-- home active -->
      <circle cx="50" cy="20" r="8" fill="#DC2626"/>
      <text x="50" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle">HOME</text>
    </g>
    <g transform="translate(180,1430)" fill="#6B7280">
      <circle cx="50" cy="20" r="7"/>
      <text x="50" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIMELINE</text>
    </g>
    <g transform="translate(300,1430)" fill="#6B7280">
      <circle cx="50" cy="20" r="7"/>
      <text x="50" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DOCS</text>
    </g>
    <g transform="translate(420,1430)" fill="#6B7280">
      <circle cx="50" cy="20" r="7"/>
      <text x="50" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">REVIEW</text>
    </g>
    <g transform="translate(540,1430)" fill="#6B7280">
      <circle cx="50" cy="20" r="7"/>
      <text x="50" y="48" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SETTINGS</text>
    </g>
  </g>

  <!-- Caption -->
  <g font-family="Inter, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="540" y="1870" font-size="32" font-weight="700" opacity="0.95">Your NCLEX dashboard in one place</text>
  </g>
</svg>
