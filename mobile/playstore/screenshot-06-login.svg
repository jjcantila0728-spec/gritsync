<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <g font-family="Inter, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="540" y="140" font-size="64" font-weight="800" letter-spacing="-1">Sign in with Face ID</text>
    <text x="540" y="216" font-size="64" font-weight="800" fill="#FCA5A5" letter-spacing="-1">or fingerprint</text>
  </g>

  <g transform="translate(180,300)">
    <rect x="-10" y="-10" width="740" height="1520" rx="80" fill="#000" filter="url(#shadow)" opacity="0.5"/>
    <rect width="720" height="1500" rx="68" fill="#0B0B0E"/>
    <rect x="14" y="14" width="692" height="1472" rx="58" fill="#FFFFFF"/>
    <rect x="290" y="14" width="140" height="28" rx="14" fill="#0B0B0E"/>

    <rect x="14" y="42" width="692" height="48" fill="#FFFFFF"/>
    <text x="40" y="74" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#111827">9:41</text>

    <!-- logo -->
    <g transform="translate(360,250)">
      <circle cx="0" cy="0" r="80" fill="url(#logo)"/>
      <path d="M-30 -8 L-10 22 L40 -28" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="360" y="384" font-family="Inter, sans-serif" font-size="44" font-weight="800" fill="#111827" text-anchor="middle">GritSync</text>
    <text x="360" y="424" font-family="Inter, sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">Your NCLEX journey — start to license</text>

    <!-- email field -->
    <g transform="translate(40,500)" font-family="Inter, sans-serif">
      <text font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">EMAIL OR GRIT ID</text>
      <rect y="20" width="640" height="72" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <circle cx="36" cy="56" r="14" fill="none" stroke="#6B7280" stroke-width="2"/>
      <circle cx="36" cy="50" r="6" fill="#6B7280"/>
      <path d="M22 70 Q36 56 50 70" fill="#6B7280"/>
      <text x="68" y="66" font-size="20" font-weight="600" fill="#111827">maria.reyes@gritsync.com</text>
    </g>

    <g transform="translate(40,632)" font-family="Inter, sans-serif">
      <text font-size="14" font-weight="800" fill="#6B7280" letter-spacing="1">PASSWORD</text>
      <rect y="20" width="640" height="72" rx="16" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="2"/>
      <rect x="26" y="44" width="22" height="22" rx="3" fill="none" stroke="#6B7280" stroke-width="2"/>
      <path d="M30 44 V36 Q30 26 40 26 Q50 26 50 36 V44" fill="none" stroke="#6B7280" stroke-width="2"/>
      <g transform="translate(68,46)" fill="#111827">
        <circle cx="6" cy="10" r="6"/>
        <circle cx="30" cy="10" r="6"/>
        <circle cx="54" cy="10" r="6"/>
        <circle cx="78" cy="10" r="6"/>
        <circle cx="102" cy="10" r="6"/>
        <circle cx="126" cy="10" r="6"/>
        <circle cx="150" cy="10" r="6"/>
        <circle cx="174" cy="10" r="6"/>
      </g>
      <text x="600" y="66" font-size="20" font-weight="800" fill="#6B7280" text-anchor="middle">👁</text>
    </g>

    <text x="640" y="770" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#DC2626" text-anchor="end">Forgot password?</text>

    <!-- Sign in button -->
    <g transform="translate(40,800)">
      <rect width="640" height="84" rx="42" fill="#DC2626"/>
      <text x="320" y="56" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Sign in</text>
    </g>

    <!-- Divider -->
    <g transform="translate(40,920)">
      <line x1="0" y1="20" x2="270" y2="20" stroke="#E5E7EB" stroke-width="2"/>
      <text x="320" y="26" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#9CA3AF" text-anchor="middle">OR</text>
      <line x1="370" y1="20" x2="640" y2="20" stroke="#E5E7EB" stroke-width="2"/>
    </g>

    <!-- Biometric -->
    <g transform="translate(40,970)">
      <rect width="640" height="200" rx="22" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="2"/>
      <g transform="translate(60,40)">
        <rect width="120" height="120" rx="24" fill="#FFFFFF" stroke="#DC2626" stroke-width="3"/>
        <path d="M30 50 q0 -28 30 -28 q30 0 30 28 v8 q0 8 -4 14 q-6 8 -10 18 q-2 8 -4 18" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M44 60 q0 -16 16 -16 q16 0 16 16 v8 q0 12 -6 22" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M58 70 q0 -4 2 -4 q4 0 4 4 v8 q0 14 -6 24" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <text x="220" y="84" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#111827">Sign in with fingerprint</text>
      <text x="220" y="116" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">Tap the sensor to unlock GritSync</text>
      <text x="220" y="148" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#DC2626">Use Face ID instead →</text>
    </g>

    <!-- Footer -->
    <g transform="translate(40,1210)">
      <text x="320" y="20" font-family="Inter, sans-serif" font-size="16" fill="#6B7280" text-anchor="middle">New to GritSync?</text>
      <text x="320" y="50" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#DC2626" text-anchor="middle">Create an account →</text>
    </g>
  </g>

  <text x="540" y="1870" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.95">Secure sign-in · biometrics built-in</text>
</svg>
