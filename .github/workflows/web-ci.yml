name: Web CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - 'docs/**'
      - '**.md'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Errors fail the build; warnings don't (the codebase carries ~2k
      # no-explicit-any warnings — lint:strict is the aspirational target).
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:run

      - name: Build (server bundle + frontend)
        run: npm run build
